<!DOCTYPE html>
<html>
<head>
    <title>AkhilSocial - Login</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #764ba2, #667eea);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🌐 AkhilSocial</h1>

    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="status"></p>

</div>

<script type="module">

    import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabaseUrl =
        "https://dqryedinxrmobrlmuixq.supabase.co";

    const supabaseKey =
        "sb_publishable_S3QMT6BUHAFZmZTatbL6Uw_Rq3EkLgl";

    const supabase =
        createClient(supabaseUrl, supabaseKey);

    window.login = async function () {

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const { error } =
            await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {

            document.getElementById("status").innerText =
                error.message;

            return;
        }

        document.getElementById("status").innerText =
            "Login successful! 🎉";

        window.location.href = "profile.html";
    };

</script>

</body>
</html>
